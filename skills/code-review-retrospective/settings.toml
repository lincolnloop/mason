# This workflow's settings, in [code-review-retrospective] of a project's settings file (see
# ../dependency-upgrades/settings.toml for the format).

[period_days]
type = 'int'
required = true
default = 30

# Where the result is published from mason's copy (`mason publish`): `issue` (in the
# project, with the `automation` label), `discussion:<category>`, or `file:<directory>`.
# Empty: kept, not published.
[publish]
type = 'list'
required = true
default = ['issue']
