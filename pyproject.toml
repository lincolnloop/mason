# mason is installed per developer as a uv tool, which puts the `mason` command on the PATH:
#   uv tool install git+https://github.com/<org>/mason@<tag>
# From a checkout, `uv run mason …` runs the same command in this repository's locked environment.
# uv provides the Python version and what uv.lock pins, so the only prerequisite on the Python side
# is uv itself. Dependencies are declared here and locked; ask before adding one, and prefer the
# standard library where it does the job.

[project]
name = 'mason'
version = '0.5.0'
description = 'Agent workflows shared across repositories'
requires-python = '>=3.12'
dependencies = []

[project.scripts]
mason = 'artifacts.cli:main'

# uv's own build backend: needed to build the package, never at run time.
[build-system]
requires = ['uv_build>=0.9.18,<0.10']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-name = 'artifacts'
module-root = 'lib'

[tool.ruff]
line-length = 100
target-version = 'py312'
extend-include = ['bin/artifact']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'Q']
ignore = ['E501']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.isort]
known-first-party = ['artifacts']
